{% extends "base.html" %}

{% block title %}Register - CareSync PH{% endblock %}

{% block content %}
<div class="min-h-[85vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-lg w-full space-y-6 bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
    
    <div class="text-center">
      <div class="w-12 h-12 mx-auto rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center mb-3">
        <i data-lucide="user-plus" class="w-6 h-6"></i>
      </div>
      <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Create an Account</h2>
      <p class="mt-1 text-xs text-slate-500">Join CareSync Clinic Booking Portal</p>
    </div>

    {% if error %}
      <div class="p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs flex items-center gap-2">
        <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
        <span>{{ error }}</span>
      </div>
    {% endif %}

    <form class="space-y-4" action="/register" method="POST">
      
      <!-- Role Selector -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Register As</label>
        <div class="grid grid-cols-2 gap-3">
          <label class="flex items-center gap-2.5 p-3 rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-50 transition" id="patientLabel">
            <input type="radio" name="role" value="PATIENT" checked onchange="toggleDoctorFields(false)" class="text-emerald-600 focus:ring-emerald-500">
            <div>
              <span class="block text-xs font-bold text-slate-800">Patient</span>
              <span class="block text-[10px] text-slate-500">Book doctor visits</span>
            </div>
          </label>
          <label class="flex items-center gap-2.5 p-3 rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-50 transition" id="doctorLabel">
            <input type="radio" name="role" value="DOCTOR" onchange="toggleDoctorFields(true)" class="text-emerald-600 focus:ring-emerald-500">
            <div>
              <span class="block text-xs font-bold text-slate-800">Physician / Doctor</span>
              <span class="block text-[10px] text-slate-500">Manage consultations</span>
            </div>
          </label>
        </div>
      </div>

      <div>
        <label for="full_name" class="block text-xs font-semibold text-slate-700">Full Name</label>
        <input id="full_name" name="full_name" type="text" required placeholder="e.g. Juan Dela Cruz"
               class="mt-1 block w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="email" class="block text-xs font-semibold text-slate-700">Email Address</label>
          <input id="email" name="email" type="email" required placeholder="juan@example.com"
                 class="mt-1 block w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>
        <div>
          <label for="phone_number" class="block text-xs font-semibold text-slate-700">Mobile Phone (Semaphore SMS)</label>
          <input id="phone_number" name="phone_number" type="text" required placeholder="09171234567"
                 class="mt-1 block w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="password" class="block text-xs font-semibold text-slate-700">Password</label>
          <input id="password" name="password" type="password" required placeholder="••••••••"
                 class="mt-1 block w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>
        <div>
          <label for="confirm_password" class="block text-xs font-semibold text-slate-700">Confirm Password</label>
          <input id="confirm_password" name="confirm_password" type="password" required placeholder="••••••••"
                 class="mt-1 block w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>
      </div>

      <!-- Doctor-specific fields (Hidden by default) -->
      <div id="doctorFields" class="hidden space-y-4 pt-2 border-t border-slate-100">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="specialization" class="block text-xs font-semibold text-slate-700">Medical Specialization</label>
            <select id="specialization" name="specialization" class="mt-1 block w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500">
              <option value="General Medicine">General Medicine</option>
              <option value="Pediatrics">Pediatrics</option>
              <option value="Cardiology">Cardiology</option>
              <option value="Dermatology">Dermatology</option>
              <option value="Orthopedics">Orthopedics</option>
              <option value="ENT">ENT (Otolaryngology)</option>
              <option value="Obstetrics & Gynecology">Obstetrics & Gynecology</option>
            </select>
          </div>
          <div>
            <label for="consultation_fee" class="block text-xs font-semibold text-slate-700">Consultation Fee (PHP)</label>
            <input id="consultation_fee" name="consultation_fee" type="number" step="50" value="500"
                   class="mt-1 block w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>
        </div>
      </div>

      <button type="submit" class="w-full py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm shadow-md shadow-emerald-600/30 transition">
        Create Account
      </button>

      <div class="text-center text-xs text-slate-500 pt-2">
        Already registered? 
        <a href="/login" class="font-semibold text-emerald-600 hover:underline">Sign in</a>
      </div>
    </form>

  </div>
</div>

<script>
  function toggleDoctorFields(show) {
    const fields = document.getElementById('doctorFields');
    if (show) {
      fields.classList.remove('hidden');
    } else {
      fields.classList.add('hidden');
    }
  }
</script>
{% endblock %}
